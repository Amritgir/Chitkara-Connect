<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Chitkara Connect</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <img src="images/images.png" alt="Chitkara University" class="brand-logo">
        <div class="brand-content">
          <h1>CHITKARA</h1>
          <span>CONNECT</span>
        </div>
      </a>
    </div>
  </nav>

  <section class="auth-page">
    <div class="auth-card">
      <h1>Create Account</h1>
      <p>Sign up using your Chitkara University email ID.</p>

      <form id="signup-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="Enter your full name" required />
        </div>

        <div class="form-group">
          <label>Chitkara Email ID</label>
          <input type="email" id="email" placeholder="example@chitkara.edu.in" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Minimum 6 characters" required />
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Re-enter password" required />
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
          <i class="fa-solid fa-user-plus"></i> Sign Up
        </button>
      </form>

      <div class="auth-switch">
        Already have an account?
        <a href="login.html">Login here</a>
      </div>
    </div>
  </section>

  <script src="js/auth.js"></script>
  <script src="js/guard.js"></script>

  <script>
    document.getElementById("signup-form").addEventListener("submit", function (e) {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (!isValidChitkaraEmail(email)) {
        alert("Please use a valid Chitkara University email ID.");
        return;
      }

      if (password.length < 6) {
        alert("Password must contain at least 6 characters.");
        return;
      }

      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }

      const users = getUsers();

      const alreadyExists = users.some(user => user.email === email);

      if (alreadyExists) {
        alert("An account with this email already exists. Please login.");
        window.location.href = "login.html";
        return;
      }

      users.push({
        name,
        email,
        password
      });

      saveUsers(users);

      alert("Account created successfully. Please login now.");
      window.location.href = "login.html";
    });
  </script>

</body>

</html>
